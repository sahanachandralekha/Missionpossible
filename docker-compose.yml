version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scamcheck_backend
    ports:
      - "8000:8000"
    environment:
      - SCAMCHECK_ENV=production
      - SCAMCHECK_HOST=0.0.0.0
      - SCAMCHECK_PORT=8000
      - SCAMCHECK_LOG_LEVEL=INFO
      - SCAMCHECK_DB_PATH=/app/data/scamcheck.db
      - SCAMCHECK_ENABLE_PERSISTENCE=true
      - SCAMCHECK_DOMAIN_PROVIDER=offline
      - SCAMCHECK_SEMANTIC_PROVIDER=deterministic
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: scamcheck_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
